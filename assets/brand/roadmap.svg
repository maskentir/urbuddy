<g class="rise" style="animation-delay:0.32s"><rect x="316" y="114" width="256" height="64" fill="#F4F0DF"/><rect x="316" y="114" width="256" height="64" fill="none" stroke="#151515" stroke-width="5"/><text x="330" y="142" font-family="Impact,'Arial Black','Franklin Gothic Medium',sans-serif" font-size="20" fill="#151515">TERMINAL</text><text x="330" y="164" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#151515">PLANNED</text></g>
<g class="rise" style="animation-delay:0.40s"><rect x="596" y="114" width="256" height="64" fill="#F4F0DF"/><rect x="596" y="114" width="256" height="64" fill="none" stroke="#151515" stroke-width="5"/><text x="610" y="142" font-family="Impact,'Arial Black','Franklin Gothic Medium',sans-serif" font-size="20" fill="#151515">INTELLIGENCE</text><text x="610" y="164" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#151515">PLANNED</text></g>
<g class="rise" style="animation-delay:0.48s"><rect x="36" y="198" width="256" height="64" fill="#F4F0DF"/><rect x="36" y="198" width="256" height="64" fill="none" stroke="#151515" stroke-width="5"/><text x="50" y="226" font-family="Impact,'Arial Black','Franklin Gothic Medium',sans-serif" font-size="20" fill="#151515">MEMORY</text><text x="50" y="248" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#151515">PLANNED</text></g>
