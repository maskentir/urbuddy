<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Roadmap. Foundation done, Core Runtime next, seven milestones planned.">
<title>Urbuddy roadmap</title>
<style>
.rise{transform-box:fill-box;transform-origin:center;animation:rise .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes rise{from{transform:translateY(16px) scale(.96)}to{transform:none}}
.wob{transform-box:fill-box;transform-origin:center;animation:wob 3.2s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.6s ease-in-out infinite alternate}
@keyframes eq{from{transform:scaleY(.55)}to{transform:scaleY(1)}}
.flow{animation:flow 1.8s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.blink{animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<g class="rise" style="animation-delay:0.00s"><rect x="36" y="30" width="256" height="64" fill="#BAF52E"/><rect x="36" y="30" width="256" height="64" fill="none" stroke="#151515" stroke-width="5"/><text x="50" y="58" font-family="Impact,'Arial Black','Franklin Gothic Medium',sans-serif" font-size="20" fill="#151515">FOUNDATION</text><text x="50" y="80" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#151515">DONE v0.1.0</text></g>
<g class="rise" style="animation-delay:0.08s"><rect x="316" y="30" width="256" height="64" fill="#FF633B"/><rect x="316" y="30" width="256" height="64" fill="none" stroke="#151515" stroke-width="5"/><text x="330" y="58" font-family="Impact,'Arial Black','Franklin Gothic Medium',sans-serif" font-size="20" fill="#151515">CORE RUNTIME</text><text x="330" y="80" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#151515">NEXT</text></g>
<g class="rise" style="animation-delay:0.16s"><rect x="596" y="30" width="256" height="64" fill="#F4F0DF"/><rect x="596" y="30" width="256" height="64" fill="none" stroke="#151515" stroke-width="5"/><text x="610" y="58" font-family="Impact,'Arial Black','Franklin Gothic Medium',sans-serif" font-size="20" fill="#151515">PERCEPTION</text><text x="610" y="80" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#151515">PLANNED</text></g>
