<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Architecture. Capture to perception to language, forking to terminal and evidence as separate consumers; intelligence, memory, and learning stay off the hot path.">
<title>Urbuddy signal flow</title>
<style>
.rise{transform-box:fill-box;transform-origin:center;animation:rise .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes rise{from{transform:translateY(16px) scale(.96)}to{transform:none}}
.wob{transform-box:fill-box;transform-origin:center;animation:wob 3.2s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.6s ease-in-out infinite alternate}
@keyframes eq{from{transform:scaleY(.55)}to{transform:scaleY(1)}}
.flow{animation:flow 1.8s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.blink{animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<rect x="0" y="0" width="900" height="360" fill="#151515"/>
<text x="40" y="30" font-family="Impact,'Arial Black','Franklin Gothic Medium',sans-serif" font-size="24" fill="#BAF52E">SIGNAL FLOW</text>
<line class="flow" x1="180" y1="79" x2="205" y2="79" stroke="#BAF52E" stroke-width="6" stroke-dasharray="14 14"/>
<line class="flow" x1="355" y1="79" x2="380" y2="79" stroke="#BAF52E" stroke-width="6" stroke-dasharray="14 14"/>
<line class="flow" x1="530" y1="79" x2="628" y2="66" stroke="#BAF52E" stroke-width="6" stroke-dasharray="14 14"/>
<line class="flow" x1="530" y1="79" x2="628" y2="156" stroke="#BAF52E" stroke-width="6" stroke-dasharray="14 14"/>
<g class="rise" style="animation-delay:0.00s"><rect x="30" y="40" width="150" height="78" fill="#F4F0DF"/><rect x="30" y="40" width="150" height="78" fill="none" stroke="#151515" stroke-width="5"/><text x="42" y="74" font-family="Impact,'Arial Black','Franklin Gothic Medium',sans-serif" font-size="19" fill="#151515">CAPTURE</text><text x="42" y="100" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#151515">swift helper</text></g>
<g class="rise" style="animation-delay:0.10s"><rect x="205" y="40" width="150" height="78" fill="#F4F0DF"/><rect x="205" y="40" width="150" height="78" fill="none" stroke="#151515" stroke-width="5"/><text x="217" y="74" font-family="Impact,'Arial Black','Franklin Gothic Medium',sans-serif" font-size="19" fill="#151515">PERCEPTION</text><text x="217" y="100" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#151515">streaming STT</text></g>
<g class="rise" style="animation-delay:0.20s"><rect x="380" y="40" width="150" height="78" fill="#F4F0DF"/><rect x="380" y="40" width="150" height="78" fill="none" stroke="#151515" stroke-width="5"/><text x="392" y="74" font-family="Impact,'Arial Black','Franklin Gothic Medium',sans-serif" font-size="19" fill="#151515">LANGUAGE</text><text x="392" y="100" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#151515">translation</text></g>
<g class="rise" style="animation-delay:0.30s"><rect x="640" y="40" width="220" height="64" fill="#F4F0DF"/><rect x="640" y="40" width="220" height="64" fill="none" stroke="#151515" stroke-width="5"/><text x="652" y="68" font-family="Impact,'Arial Black','Franklin Gothic Medium',sans-serif" font-size="19" fill="#151515">TERMINAL</text><text x="652" y="90" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#151515">ink TUI</text></g>
<g class="rise" style="animation-delay:0.40s"><rect x="640" y="128" width="220" height="64" fill="#F4F0DF"/><rect x="640" y="128" width="220" height="64" fill="none" stroke="#151515" stroke-width="5"/><text x="652" y="156" font-family="Impact,'Arial Black','Franklin Gothic Medium',sans-serif" font-size="19" fill="#151515">EVIDENCE</text><text x="652" y="178" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#151515">sqlite journal</text></g>
<g class="rise" style="animation-delay:.55s" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700">
<rect x="40" y="216" width="264" height="58" fill="none" stroke="#8A8672" stroke-width="3" stroke-dasharray="8 6"/><text x="56" y="241" fill="#F4F0DF">INTELLIGENCE, supervisory</text><text x="56" y="262" fill="#8A8672">off hot path</text>
<rect x="318" y="216" width="264" height="58" fill="none" stroke="#8A8672" stroke-width="3" stroke-dasharray="8 6"/><text x="334" y="241" fill="#F4F0DF">MEMORY, graphiti sidecar</text><text x="334" y="262" fill="#8A8672">derived, rebuildable</text>
<rect x="596" y="216" width="264" height="58" fill="none" stroke="#8A8672" stroke-width="3" stroke-dasharray="8 6"/><text x="612" y="241" fill="#F4F0DF">LEARNING, fsrs</text><text x="612" y="262" fill="#8A8672">measured progress</text>
</g>
<g class="rise" style="animation-delay:.7s"><rect x="40" y="288" width="820" height="48" fill="#FF633B"/><text x="60" y="319" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#151515" textLength="780" lengthAdjust="spacingAndGlyphs">data plane keeps running when intelligence, memory, or learning fail</text></g>
</svg>
