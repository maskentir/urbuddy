name: secret-scan

on:
  pull_request:
    branches: [master, feat/muse-stt-qualification]

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71
        with:
          path: ./
          base: master
          head: HEAD
